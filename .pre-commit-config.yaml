default_language_version:
    python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        exclude: '\.*conda/.*'
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.txt$|\.tsv$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements
      - id: check-added-large-files

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]

  - repo: https://github.com/populationgenomics/pre-commits
    rev: "v0.1.3"
    hooks:
      - id: cpg-id-checker
        args: ["--extra-pattern", 'TOB\d+']
        exclude: >-
          (?x)^(
              test/test_audit\.py|
              models/utils/sequencing_group_id_format\.py|
              metamist/audit/README\.md
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.0
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/jmarshall/pyright-python
    rev: main
    hooks:
      - id: pyright
        verbose: true
        additional_dependencies:
          - aiohttp==3.13
          - async-lru==2.1
          - click==8.3
          - cpg-utils>=5.5.0
          - duckdb==1.4
          - flask
          - functions-framework==3.10
          - google-cloud-bigquery==3.40
          - google-cloud-logging==3.13
          - google-cloud-pubsub==2.34
          - gql==4.0
          - httpx==0.28.0
          - hypercorn>=0.18.0
          - psycopg[binary]==3.3
          - psycopg-pool==3.3
          - strawberry-graphql[fastapi]==0.291.0
          - pyarrow==23.0
          - pyinstrument
          - pulumi>=3.223.0
          - pulumi-docker>=4.11.0
          - pulumi-gcp>=9.13.0
          - pytest==9.0
          - pytest-asyncio==1.3
          - pytz>=2025.2
          - slack-sdk==3.39
          - testcontainers==4.14

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.5.2
    hooks:
      - id: zizmor
