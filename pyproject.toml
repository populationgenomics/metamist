[project]
name = "metamist-root"
version = "7.14.0"
requires-python = "==3.14.*"
dependencies = [
    "backoff~=2.2",
    "cpg-utils>=5.5.0",
    "google-auth~=2.48",
    "click~=8.3",
    "gql[aiohttp,requests]~=4.0",
    "python-dateutil~=2.9",
    "requests~=2.32",
    "tabulate ~= 0.9.0",
    "urllib3 ~= 2.6",
    "aiohttp~=3.13",
    "async-lru~=2.1",
    "cloudpathlib~=0.23.0",
    "cryptography~=46.0",
    "duckdb~=1.4",
    "fastapi[all]~=0.128.0",
    "fsspec==2026.1.0",
    "google-cloud-bigquery~=3.40",
    "google-cloud-logging~=3.13",
    "google-cloud-pubsub~=2.34",
    "google-cloud-storage~=3.8",
    "pyarrow~=23.0",
    "slack-sdk~=3.39",
    "strawberry-graphql[fastapi]~=0.291.0",
    "psycopg[binary]~=3.3",
    "psycopg-pool~=3.3",
    "pytest~=9.0",
    "hypercorn>=0.18.0",
]

[dependency-groups]
dev = [
    "bump-my-version~=1.2",
    "coverage~=7.6",
    "functions-framework~=3.10",
    "openapi-generator-cli==5.3.0",
    "pre-commit~=4.5.1",
    "pytest~=9.0",
    "pytest-asyncio~=1.3",
    "pytest-cov~=7.0",
    "pytz>=2025.2",
    "testcontainers~=4.14",
    "httpx~=0.28.0",
    "pip-audit~=2.10",
    "strawberry-graphql[debug-server]~=0.291.0",
    "metamist",
    "ruff>=0.15.0",
    "pulumi>=3.223.0",
    "pulumi-gcp>=9.13.0",
    "pulumi-docker>=4.11.0",
    "pygithub>=2.8.1",
    "pyright>=1.1.409",
]

[tool.uv]
package = false
constraint-dependencies = [
    "aiomysql~=0.3.0",
    "azure-core>=1.38.0",
    "filelock>=3.20.1",
    "pyasn1>=0.6.2",
    "python-multipart>=0.0.22",
    "starlette>=0.49.1",
    "virtualenv>=20.36.1",
    "werkzeug>=3.1.5"
]

[tool.uv.sources]
metamist = { path = "packages/metamist", editable = true }

[tool.coverage.run]
omit = [
    "test/*",
    "test/**/*",
    "packages/metamist/src/metamist/api/*",
    "packages/metamist/src/metamist/apis/*",
    "packages/metamist/src/metamist/model/*",
    "packages/metamist/src/metamist/models/*",
    "packages/metamist/src/metamist/*.py",
]

[tool.pyright]
include = ["api", "db", "etl", "models", "packages", "test"]
exclude = [
    # Source files generated by OpenAPI Generator
    "packages/metamist/src/metamist/api/*",
    "packages/metamist/src/metamist/apis/*",
    "packages/metamist/src/metamist/model/*",
    "packages/metamist/src/metamist/models/*",
    "packages/metamist/src/metamist/*.py",
]

pythonVersion = "3.14"
pythonPlatform = "Linux"

# Find installed packages in the usual uv virtual environment
# If your venv is elsewhere, you may need to use --venvpath or adjust these
venvPath = "."
venv = ".venv"

executionEnvironments = [
    # Check the metamist API remains compatibile with earlier Pythons
    { root = "packages/metamist", pythonVersion = "3.10" },
]
