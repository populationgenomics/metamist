name: Database Migration

on:
  push:
    branches:
      - SET-1017-set-up-metamist-postgres-deployment
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
      command:
        description: 'Migration command'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - up


permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate production runs from main only
        if: github.event.inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production migrations can only be triggered from the main branch"
          echo ""
          echo "You are on branch: ${{ github.ref }}"
          echo "Production migrations require: refs/heads/main"
          exit 1

      - name: Validate rollback has confirmation
        if: github.event.inputs.command == 'down' && github.event.inputs.confirm_migration == ''
        run: |
          echo "::error::Rollback requires confirmation"
          echo ""
          echo "To rollback a migration:"
          echo "1. First run with command=status to see current state"
          echo "2. Then run with command=down and paste the migration name in confirm_migration"
          exit 1

  run-migration:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.event.inputs.environment == 'production' && 'pg-production' || 'pg-development' }}
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: 1
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - id: 'google-cloud-auth'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WORKLOAD_IDENTITY_SA }}

      - id: 'google-cloud-sdk-setup'
        name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: 'set-variables'
        name: 'Set environment-specific variables'
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            echo "JOB_NAME=metamist-migration-production" >> $GITHUB_OUTPUT
            echo "REGION=australia-southeast1" >> $GITHUB_OUTPUT
          else
            echo "JOB_NAME=metamist-migration-development" >> $GITHUB_OUTPUT
            echo "REGION=australia-southeast1" >> $GITHUB_OUTPUT
          fi

      - id: 'run-migration'
        name: 'Execute migration job'
        run: |
          echo "============================================"
          echo "Running: ${{ github.event.inputs.command }}"
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Job: ${{ steps.set-variables.outputs.JOB_NAME }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "============================================"
          
          # Build environment variable overrides
          ENV_VARS="MIGRATION_COMMAND=${{ github.event.inputs.command }}"
          ENV_VARS="$ENV_VARS,GITHUB_REPOSITORY=${{ github.repository }}"
          ENV_VARS="$ENV_VARS,GITHUB_REF=${{ github.ref }}"
          
          
          # Execute the Cloud Run job and capture output
          gcloud run jobs execute ${{ steps.set-variables.outputs.JOB_NAME }} \
            --region=${{ steps.set-variables.outputs.REGION }} \
            --update-env-vars="$ENV_VARS" \
            --wait

      - id: 'show-logs'
        name: 'Show execution logs'
        if: always()
        run: |
          echo ""
          echo "============================================"
          echo "Job execution logs (last 50 lines)"
          echo "============================================"
          
          # Get the latest execution
          EXECUTION=$(gcloud run jobs executions list \
            --job=${{ steps.set-variables.outputs.JOB_NAME }} \
            --region=${{ steps.set-variables.outputs.REGION }} \
            --limit=1 \
            --format="value(name)")
          
          echo "Execution: $EXECUTION"
          echo ""
          
          # Fetch logs
          gcloud logging read "resource.type=cloud_run_job AND resource.labels.job_name=${{ steps.set-variables.outputs.JOB_NAME }}" \
            --limit=50 \
            --format="value(textPayload)" \
            --order=asc \
            2>/dev/null || echo "Could not fetch logs (may take a moment to appear)"
