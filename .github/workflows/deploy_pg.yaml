name: Deploy PG
on:
  # Building on manual dispatch, and pushes to dev / main.
  workflow_dispatch:
  push:
    branches:
      - pg-main
      - pg-dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/pg-main' && 'pg-production' || 'pg-development' }}
  cancel-in-progress: false

permissions: {}

jobs:
  # @TODO re-enable this when ready
  # unittests:
  #   uses: './.github/workflows/test.yaml'
  #   secrets:
  #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    # needs: unittests
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.ref == 'refs/heads/pg-main' && 'pg-production' || 'pg-development' }}
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: 1
      SM_ENVIRONMENT: ${{ vars.SM_ENVIRONMENT }}
    defaults:
      run:
        shell: bash -eo pipefail -l {0}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - id: 'google-cloud-auth'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.WORKLOAD_IDENTITY_SA }}

      - id: 'google-cloud-sdk-setup'
        name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: 'gcloud docker auth'
        run: |
          gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: "Set up Python"
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7.1.4
        with:
          enable-cache: true
          version: 0.9.13

      - name: Install the project
        run: uv sync --locked

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Bump version for development
        if: vars.SM_ENVIRONMENT == 'development'
        run: |
          # PyPI rejects local version identifiers (the "+<sha>" segment), so we
          # publish a PEP 440 dev release using the run number as the (unique,
          # monotonically increasing) dev segment: e.g. 8.0.0.dev123
          # This dev version won't be installed unless explicitly specified by the user
          # @TODO remove this before final merge
          uv run bump-my-version bump patch \
            --no-commit --allow-dirty \
            --new-version $(cat deploy/python/version.txt).dev${{ github.run_number }}

      - name: "build deployable API"
        run: |
          uv run regenerate_api.py
          ls -lGh packages/metamist/src/metamist/

      - name: "build web front-end"
        run: |
          set -eo pipefail
          pushd web
          npm ci
          npm run build
          popd


      - name: Build python package
        run: |
          pushd packages/metamist
          uv build --sdist --out-dir dist
          popd

      - name: Smoke test python package
        run: |
          # There should only be one tarball here but a loop means
          # we don't need to work out what the filename ended up being
          for tarball in packages/metamist/dist/*.tar.gz; do
            echo "Testing package dist $tarball"
            uv run \
              --with "$tarball" \
              --no-project \
              --isolated \
              -- python -c "import metamist;"
          done

      # @TODO switch the back to prod deploy before final release
      - name: Publish dev package to PyPI
        if: vars.SM_ENVIRONMENT == 'development'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/metamist/dist
          skip-existing: true


      # The config needed to deploy is stored in the metamist-private repository
      # The next two steps check out that repo and copy the necessary config files
      - name: Checkout private config repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          repository: populationgenomics/metamist-private
          path: metamist-private
          token: ${{ secrets.METAMIST_PRIVATE_PAT }}
          persist-credentials: false

      - name: Get config repo SHA
        run: |
          echo "METAMIST_PRIVATE_SHA=$(git -C metamist-private rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy Pulumi configs
        env:
          PULUMI_STACK_NAME: ${{ vars.PULUMI_STACK_NAME }}
        run: |
          cp "metamist-private/metamist_infra_config/Pulumi.${PULUMI_STACK_NAME}.yaml" deploy/

      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6.6.1
        with:
          command: up
          work-dir: ./deploy
          stack-name: ${{ vars.PULUMI_STACK_NAME }}
          cloud-url: ${{ vars.PULUMI_STATE_BUCKET }}
          parallel: 20 # Otherwise requests might time out.
        env:
          METAMIST_PRIVATE_SHA: ${{ env.METAMIST_PRIVATE_SHA }}
          # skip checkpointing to speed-up the workflow, and avoid lots of saved state jsons
          PULUMI_SKIP_CHECKPOINTS: true
