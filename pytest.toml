[pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test"]
python_files = [
    "test_project_connection.py",
    "test_project_graphql.py",
    "test_json_merge_patch.py",
    "test_project_groups.py",
    "test_sequencing_groups.py",
    "test_generic_filters.py",
    "test_sample.py",
    "test_participant.py",
    "test_assay.py",
    "test_analysis.py",
    "test_external_id.py",
    "test_comment.py",
    "test_meta_table.py",
    "test_analysis_output_files.py",
    "test_enum_tables.py",
    "test_analysis_runner.py",
    "test_cohort.py",
    "test_cohort_status.py",
    "test_web.py",
    "test_project_insights.py",
    "test_update_participant_family.py",
    "test_pedigree.py",
    "test_search.py",
    "test_graphql.py",
    "test_billing_samples.py",
    "test_bq_billing_ar_batch.py",
    "test_bq_billing_base.py",
    "test_bq_billing_daily.py",
    "test_bq_billing_daily_extended.py",
    "test_bq_billing_gcp_daily.py",
    "test_bq_billing_raw.py",
    "test_bq_function_filter.py",
    "test_bq_generic_filter.py"
]
python_classes = ["Test*"]
python_functions = ["test_*"]
collect_imported_tests = false # only include tests in test files
addopts = [
    "-v",
    "--tb=short"
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
