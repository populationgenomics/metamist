[pytest]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test"]
python_files = [
    "test_project_connection.py",
    "test_project_graphql.py",
    "test_json_merge_patch.py",
    "test_project_groups.py",
    "test_generic_filters.py",
    "test_participant.py",
    "test_assay.py",
    "test_external_id.py",
    "test_comment.py",
    "test_meta_table.py"
]
python_classes = ["Test*"]
python_functions = ["test_*"]
collect_imported_tests = false # only include tests in test files
addopts = [
    "-v",
    "--tb=short"
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
